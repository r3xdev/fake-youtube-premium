<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 280px;
            background: #0f0f0f;
            color: #fff;
            font-family: 'YouTube Sans', 'Roboto', Arial, sans-serif;
            font-size: 14px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 20px 14px;
            border-bottom: 1px solid #272727;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .list {
            padding: 6px 0;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 20px;
            cursor: default;
            transition: background 0.15s;
        }

        .item:hover {
            background: #1a1a1a;
        }

        .label {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .label-title {
            font-size: 14px;
            color: #fff;
        }

        .label-desc {
            font-size: 12px;
            color: #909090;
        }

        .toggle {
            position: relative;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
        }

        .toggle input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #3f3f3f;
            border-radius: 22px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .slider::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle input:checked + .slider {
            background: #ff0000;
        }

        .toggle input:checked + .slider::before {
            transform: translateX(18px);
        }

        .footer {
            padding: 10px 20px;
            border-top: 1px solid #272727;
            font-size: 11px;
            color: #4a4a4a;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <svg width="22" height="15" viewBox="0 0 28.57 20">
            <path d="M27.97 3.12A3.58 3.58 0 0 0 25.44.6C23.22 0 14.28 0 14.28 0S5.35 0 3.12.6A3.58 3.58 0 0 0 .6 3.12C0 5.35 0 10 0 10s0 4.65.6 6.88a3.58 3.58 0 0 0 2.52 2.52C5.35 20 14.28 20 14.28 20s8.94 0 11.16-.6a3.58 3.58 0 0 0 2.52-2.52C28.57 14.65 28.57 10 28.57 10s0-4.65-.6-6.88z" fill="#ff0000"/>
            <path d="M11.43 14.28L18.85 10l-7.42-4.28v8.56z" fill="#fff"/>
        </svg>
        <h1></h1>
    </div>

    <div class="list">
        <div class="item">
            <div class="label">
                <span class="label-title" data-i18n="logoTitle"></span>
                <span class="label-desc" data-i18n="logoDesc"></span>
            </div>
            <label class="toggle">
                <input type="checkbox" id="toggle-logo">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="footer"></div>

    <script src="popup.js"></script>
</body>
</html>
